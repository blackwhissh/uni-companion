services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uni-companion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-unicompanion}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - uni_companion_pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  identity:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: uni-companion-identity
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      IDENTITY_DATABASE_URL: jdbc:postgresql://postgres:5432/identity
      DATABASE_USERNAME: ${DATABASE_USERNAME:-unicompanion}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@uni-companion.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  learning:
    build:
      context: .
      dockerfile: services/learning-service/Dockerfile
    container_name: uni-companion-learning
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod,${AI_PROFILE:-fake}
      LEARNING_DATABASE_URL: jdbc:postgresql://postgres:5432/learning
      DATABASE_USERNAME: ${DATABASE_USERNAME:-unicompanion}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      STORAGE_LOCAL_PATH: /data/materials
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-uniconai}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
    volumes:
      - materials:/data/materials
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_IDENTITY_API_URL: /identity
        VITE_LEARNING_API_URL: /learning
    container_name: uni-companion-web
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      CADDY_SITE: ${CADDY_SITE:-:80}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      identity:
        condition: service_healthy
      learning:
        condition: service_healthy

volumes:
  uni_companion_pg:
  materials:
