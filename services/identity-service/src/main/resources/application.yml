spring:
  application:
    name: identity-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

unicompanion:
  jwt:
    secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-32}
    ttl: 12h
    refresh-ttl: 14d
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@uni-companion.local}
    admin-password: ${SEED_ADMIN_PASSWORD:admin-pass-1}
    admin-display-name: Course Admin
  cors-allowed-origins:
    - http://localhost:5173

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8081

logging:
  level:
    root: INFO
    com.unicompanion: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] %-40.40logger{39} [cid=%X{correlationId:-} trace=%X{traceId:-}] : %m%n%wEx"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
    tracing:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
