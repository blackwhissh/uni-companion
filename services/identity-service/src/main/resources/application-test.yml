spring:
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.unicompanion: INFO
    com.unicompanion.identity.api.RequestAccessLogFilter: WARN

unicompanion:
  identity:
    verification:
      domains:
        - uni-siegen.de
        - uni.test
      log-codes: false
  jwt:
    secret: test-secret-test-secret-test-secret
    ttl: 1h
    refresh-ttl: 2d
  seed:
    admin-email: admin@uni-companion.test
    admin-password: admin-pass-1
    admin-display-name: Course Admin

management:
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 0.0
    export:
      otlp:
        enabled: false
