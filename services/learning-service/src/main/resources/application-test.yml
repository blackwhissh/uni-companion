spring:
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.unicompanion: INFO
    com.unicompanion.learning.config.RequestAccessLogFilter: WARN

unicompanion:
  jwt:
    secret: test-secret-test-secret-test-secret
  storage:
    path: target/test-materials
  ingest:
    async: false
  rate-limit:
    enabled: false
    requests-per-minute: 1000
    burst: 1000
  gemini:
    enabled: false

management:
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 0.0
    export:
      otlp:
        enabled: false
