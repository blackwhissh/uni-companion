spring:
  application:
    name: learning-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

unicompanion:
  jwt:
    secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-32}
  cors-allowed-origins:
    - http://localhost:5173
  storage:
    path: ${STORAGE_LOCAL_PATH:./data/materials}
  ingest:
    async: true
  rate-limit:
    enabled: true
    requests-per-minute: 30
    burst: 10
  study:
    max-shared-versions: ${STUDY_MAX_SHARED_VERSIONS:3}
    report-retirement-threshold: ${STUDY_REPORT_RETIREMENT_THRESHOLD:3}
    generation-revision: ${STUDY_GENERATION_REVISION:v3}
  gemini:
    enabled: ${GEMINI_VERTEX_ENABLED:false}
    project-id: ${GOOGLE_CLOUD_PROJECT:uniconai}
    location: ${GOOGLE_CLOUD_LOCATION:global}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    chat-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
  lms:
    # fake = in-memory demo catalog (demo-moodle-course). Real Moodle/ILIAS adapters come later.
    provider: ${LMS_PROVIDER:fake}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8082

logging:
  level:
    root: INFO
    com.unicompanion: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] %-40.40logger{39} [cid=%X{correlationId:-} trace=%X{traceId:-}] : %m%n%wEx"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Process alive — do not require DB (orchestrators must not kill pods during DB blips).
        liveness:
          include: livenessState
        # Safe to receive traffic — DB must be reachable.
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
    tracing:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    annotations:
      enabled: true
