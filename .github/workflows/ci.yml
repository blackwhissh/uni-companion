name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Maven tests
        run: mvn -B test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Oracle
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
    steps:
      - name: Skip when Oracle secrets are missing
        if: env.ORACLE_HOST == ''
        run: |
          echo "ORACLE_HOST is not set. After the first server install, add secrets"
          echo "ORACLE_HOST, ORACLE_USER, and ORACLE_SSH_KEY so this job deploys on each push."

      - name: Deploy over SSH
        if: env.ORACLE_HOST != ''
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            if [ ! -d /opt/uni-companion/.git ]; then
              echo "App is not installed. Run deploy/oracle-bootstrap.sh on the server first."
              exit 1
            fi
            bash /opt/uni-companion/deploy/remote-deploy.sh
