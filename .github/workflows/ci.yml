name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Maven tests
        run: mvn -B test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Google Cloud
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GCP_HOST: ${{ secrets.GCP_HOST }}
    steps:
      - name: Skip when GCP secrets are missing
        if: env.GCP_HOST == ''
        run: |
          echo "GCP_HOST is not set. After the first server install, add secrets"
          echo "GCP_HOST, GCP_USER, and GCP_SSH_KEY so this job deploys on each push."

      - name: Deploy over SSH
        if: env.GCP_HOST != ''
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            if [ ! -d /opt/uni-companion/.git ]; then
              echo "App is not installed. Run deploy/gcp-bootstrap.sh on the server first."
              exit 1
            fi
            bash /opt/uni-companion/deploy/remote-deploy.sh
