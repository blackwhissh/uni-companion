services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uni-companion-postgres
    environment:
      POSTGRES_USER: unicompanion
      POSTGRES_PASSWORD: unicompanion
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - uni_companion_pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicompanion -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  uni_companion_pg:
